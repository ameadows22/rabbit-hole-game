<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rabbit Hole - Phase 1: Welcome Back</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121418; 
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden; 
    }

    .game-card {
      background: #1e222b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      z-index: 2; 
    }

    .phase-banner {
      color: #ffffff;
      background-color: #111317;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
      display: inline-block;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 26px;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 20px;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .stage-img {
      width: 100%;
      max-width: 450px;
      height: auto;
      border-radius: 8px;
      margin: 0 auto 20px auto;
      display: block;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .narrative-box {
      background-color: #111317;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 24px;
      text-align: center;
    }

    .narrative {
      font-size: 15px;
      line-height: 1.6;
      color: #e0e0e0;
    }

    .choices-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    .custom-btn {
      padding: 14px 22px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      color: #ffffff;
      background-color: #2eba00;
      border: 2px solid #2eba00;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease-in-out;
      flex: 1 1 200px; 
      max-width: 280px;
    }

    .custom-btn:hover {
      background-color: #000000;
      color: #2eba00;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(46, 186, 0, 0.3);
    }

    .custom-btn:active {
      transform: translateY(0);
    }

    .liquid-screen {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%; 
      background-color: #2eba00; 
      z-index: 10; 
      transition: height 0.6s cubic-bezier(0.77, 0, 0.175, 1); 
      pointer-events: none;
    }

    .liquid-screen.fill {
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="liquidOverlay" class="liquid-screen"></div>

  <main class="game-card">
    <div class="phase-banner">
      Phase 1: The Rabbit Hole
    </div>

    <h1>Welcome Back!</h1>

    <img src="The Rabbit Hole.png" alt="Phase One: The Rabbit Hole" class="stage-img">

    <div class="narrative-box">
      <p class="narrative">
        Familiar disorienting visuals swirl around you...
      </p>
    </div>

    <div class="choices-container">
      <button class="custom-btn" onclick="triggerLiquidFill('Mad Tea Party 2.html')">
        TAKE ANOTHER SIP
      </button>
    </div>
  </main>

  <script>
    function triggerLiquidFill(targetUrl) {
      const overlay = document.getElementById('liquidOverlay');
      
      overlay.classList.add('fill');

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 600);
    }
  </script>

</body>
</html>
