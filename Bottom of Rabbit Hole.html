<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rabbit Hole - Phase 5: The Bottom of the Rabbit Hole</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #020202; 
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #e0e0e0;
    }

    .game-card {
      background: #111317;
      border: 1px solid rgba(46, 186, 0, 0.3); 
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(46, 186, 0, 0.15);
      text-align: center;
    }

    .phase-banner {
      color: #ffffff;
      background-color: rgba(2, 2, 2, 0.9);
      border: 1px solid rgba(175, 148, 148, 0.2);
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
      display: inline-block;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 24px;
      letter-spacing: 2px;
      color: #42ec18; 
      margin-bottom: 20px;
      text-transform: uppercase;
      line-height: 1.3;
      text-shadow: 0 0 10px rgba(66, 236, 24, 0.3);
    }

    .stage-img {
      width: 100%;
      max-width: 450px;
      height: auto;
      border-radius: 8px;
      margin: 0 auto 20px auto;
      display: block;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
    }

    .narrative-box {
      background-color: #080a0c;
      border: 1px solid rgba(66, 236, 24, 0.2);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
      min-height: 80px;
    }

    .narrative {
      font-size: 15px;
      line-height: 1.6;
      color: #42ec18;
    }

    .scoreboard-box {
      background-color: #0d0f13;
      border: 1px solid rgba(66, 236, 24, 0.4);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .scoreboard-title {
      font-size: 16px;
      color: #42ec18;
      text-align: center;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .score-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      border-bottom: 1px dashed rgba(66, 236, 24, 0.15);
      font-size: 14px;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-name {
      color: #ffffff;
    }

    .score-time {
      color: #42ec18;
      font-weight: bold;
    }

    .name-input-box {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .name-input {
      background: #080a0c;
      border: 1px solid #2eba00;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      width: 60%;
    }

    .save-btn {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: bold;
      font-family: inherit;
      color: #000000;
      background-color: #2eba00;
      border: 1px solid #2eba00;
      border-radius: 6px;
      cursor: pointer;
    }

    .save-btn:hover {
      background-color: #000000;
      color: #2eba00;
    }

    .choices-container {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .custom-btn {
      padding: 14px 22px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      color: #000000;
      background-color: #2eba00;
      border: 2px solid #2eba00;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease-in-out;
      flex: 1 1 200px;
      max-width: 280px;
    }

    .custom-btn:hover {
      background-color: #000000;
      color: #2eba00;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(46, 186, 0, 0.4);
    }
  </style>
</head>
<body>

  <main class="game-card">
    <div class="phase-banner">
      Phase 5: The Bottom of the Rabbit Hole
    </div>

    <h1>CONGRATS YOU MADE IT OUT</h1>

    <img src="Bottom of Rabbit Hole.png" alt="Stage Five: The Bottom of the Rabbit Hole" class="stage-img">

    <div class="narrative-box">
      <p id="typewriter-text" class="narrative"></p>
    </div>

    <div id="name-form-container" class="name-input-box">
      <input type="text" id="player-name" class="name-input" placeholder="Enter your name..." maxlength="15">
      <button class="save-btn" onclick="saveScore()">SAVE TIME</button>
    </div>

    <div class="scoreboard-box">
      <div class="scoreboard-title">🏆 RABBIT HOLE LEADERBOARD</div>
      <ul id="score-list" class="score-list">
      </ul>
    </div>

    <div class="choices-container">
      <button id="restart-btn" class="custom-btn" onclick="handleRestart()">
        ENTER THE RABBIT HOLE AGAIN
      </button>
    </div>
  </main>

  <script>
   
    let startTime = localStorage.getItem('startTime');
    let runTimeInSeconds = 0;

    if (startTime) {
      runTimeInSeconds = ((Date.now() - parseInt(startTime)) / 1000).toFixed(2);
    } else {
      runTimeInSeconds = (Math.random() * 20 + 25).toFixed(2);
    }

    const fullText = `You made it to the bottom in ${runTimeInSeconds} seconds! Enter your name to register your time on the leaderboard.`;
    let charIndex = 0;
    const textElement = document.getElementById("typewriter-text");

    function typeWriter() {
      if (charIndex < fullText.length) {
        textElement.textContent += fullText.charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, 30);
      }
    }
    window.onload = () => {
      typeWriter();
      displayLeaderboard();
    };

    function getScores() {
      const savedScores = localStorage.getItem('rabbitHoleScores');
      return savedScores ? JSON.parse(savedScores) : [];
    }

    function displayLeaderboard() {
      const scores = getScores();
      const listElement = document.getElementById('score-list');
      listElement.innerHTML = '';

      if (scores.length === 0) {
        listElement.innerHTML = '<li class="score-item" style="justify-content:center;">No scores recorded yet!</li>';
        return;
      }

      scores.forEach((entry, index) => {
        const li = document.createElement('li');
        li.className = 'score-item';
        li.innerHTML = `
          <span class="score-name">#${index + 1} ${entry.name}</span>
          <span class="score-time">${entry.time}s</span>
        `;
        listElement.appendChild(li);
      });
    }

    function saveScore() {
      const nameInput = document.getElementById('player-name');
      const name = nameInput.value.trim();

      if (!name) {
        alert("Please enter a valid name!");
        return;
      }

      let scores = getScores();
      scores.push({ name: name, time: parseFloat(runTimeInSeconds) });

      scores.sort((a, b) => a.time - b.time);

      scores = scores.slice(0, 5);

      localStorage.setItem('rabbitHoleScores', JSON.stringify(scores));

      document.getElementById('name-form-container').style.display = 'none';
      displayLeaderboard();
    }

    function handleRestart() {
      localStorage.setItem('startTime', Date.now());
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
