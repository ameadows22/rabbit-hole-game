<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rabbit Hole - Phase 3: The Long Hall</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121418; 
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-card {
      background: #1e222b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .phase-banner {
      color: #ffffff;
      background-color: #111317;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
      display: inline-block;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 26px;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 20px;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .stage-img {
      width: 100%;
      max-width: 450px;
      height: auto;
      border-radius: 8px;
      margin: 0 auto 20px auto;
      display: block;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .narrative-box {
      background-color: #111317;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 24px;
      text-align: center;
    }

    .narrative {
      font-size: 15px;
      line-height: 1.6;
      color: #e0e0e0;
    }

    .choices-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .custom-btn {
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      color: #ffffff;
      background-color: #2eba00;
      border: 2px solid #2eba00;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease-in-out;
      flex: 1 1 160px; 
      max-width: 200px;
    }

    .custom-btn:hover {
      background-color: #000000;
      color: #2eba00;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(46, 186, 0, 0.3);
    }

    .custom-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <main class="game-card">
    <div class="phase-banner">
      Phase 3: The Long Hall
    </div>


    <img src="Long Hall.png" alt="Stage Three: The Long Hall" class="stage-img">

    <div class="narrative-box">
      <p class="narrative">
        You have landed in the Long Hall. Try not to get lost in its endlessness.
        Making the right decision is crucial to your escape.
      </p>
    </div>

    <div class="choices-container">
      <button class="custom-btn" onclick="window.location.href='Time Castle.html';">
        DOOR 1
      </button>
      <button class="custom-btn" onclick="window.location.href='Rabbit Hole Room 2.html';">
        DOOR 2
      </button>
      <button class="custom-btn" onclick="window.location.href='Mad Tea Party 3.html';">
        DOOR 3
      </button>
    </div>
  </main>

</body>
</html>
