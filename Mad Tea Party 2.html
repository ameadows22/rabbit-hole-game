<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rabbit Hole - Phase 2: Mad Tea Party Return</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-image: url('https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExZTAwbTAzZjJvdzFyZ25qMXc1bGRhbjR0aWxscGlkaDV6NHV1dGt5MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/WrHrrwqxCTTb7uKQQX/giphy.gif');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Courier New', Courier, monospace;
      color: #e0e0e0;
    }

    .game-card {
      background: rgba(30, 34, 43, 0.9); 
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .phase-banner {
      color: #ffffff;
      background-color: rgba(2, 2, 2, 0.87);
      border: 1px solid rgba(175, 148, 148, 0.2);
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
      display: inline-block;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 26px;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 20px;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .stage-img {
      width: 100%;
      max-width: 450px;
      height: auto;
      border-radius: 8px;
      margin: 0 auto 20px auto;
      display: block;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    .narrative-box {
      background-color: rgb(0, 0, 0);
      border: 2px solid rgb(0, 0, 0);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 24px;
      text-align: center;
    }

    .narrative {
      font-size: 15px;
      line-height: 1.6;
      color: rgb(255, 255, 255);
    }

    .choices-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      position: relative; 
      padding: 20px 0;
    }

    .custom-btn {
      padding: 14px 22px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      color: #ffffff;
      background-color: #000000;
      border: 2px solid #2eba00;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease-out;
      flex: 1 1 200px;
      max-width: 280px;
    }

    .custom-btn:hover {
      background-color: #2eba00; 
      color: #000000;
      box-shadow: 0 4px 12px rgba(46, 186, 0, 0.4);
    }

    .custom-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <main class="game-card">
    <div class="phase-banner">
      Phase 2: The Mad Tea Party
    </div>


    <img src="Mad Tea Party.png" alt="Stage Two: Mad Tea Party Return" class="stage-img">

    <div class="narrative-box">
      <p class="narrative">
        We are happy you decided to join us. 
        The tea really is quite delightful, isn't it? The more you drink, the more the madness unfolds.
        Dare to take another sip?
      </p>
    </div>

    <div class="choices-container">
      <button class="custom-btn" onmouseover="moveButton(this)" onclick="window.location.href='Rabbit Hole.html';">
        TAKE ANOTHER SIP
      </button>
      <button class="custom-btn" onmouseover="moveButton(this)" onclick="window.location.href='Long Hall.html';">
        WALK AWAY
      </button>
    </div>
  </main>

  <script>
    function moveButton(btn) {
      const randomX = Math.floor(Math.random() * 200) - 100; 
      const randomY = Math.floor(Math.random() * 100) - 50;  
      btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }
  </script>

</body>
</html>
