<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rabbit Hole - Phase 1: Back to the Beginning</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121418; 
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-card {
      background: #1e222b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .timer-box {
      color: #ff3333;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 15px;
      background: #111317;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255, 51, 51, 0.2);
      display: inline-block;
    }

    .phase-banner {
      color: #ffffff;
      background-color: #111317;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
      display: inline-block;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 24px;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 20px;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .stage-img {
      width: 100%;
      max-width: 450px;
      height: auto;
      border-radius: 8px;
      margin: 0 auto 20px auto;
      display: block;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .narrative-box {
      background-color: #111317;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 24px;
      text-align: center;
    }

    .narrative {
      font-size: 15px;
      line-height: 1.6;
      color: #e0e0e0;
    }

    .blocks-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      position: relative;
      min-height: 80px;
      padding: 10px;
    }

    .yellow-block-btn {
      width: 70px;
      height: 45px;
      background-color: #ffea00;
      border: 2px solid #ffea00;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s ease-out;
      box-shadow: 0 0 12px rgba(255, 234, 0, 0.4);
    }

    .yellow-block-btn:hover {
      box-shadow: 0 0 20px rgba(255, 234, 0, 0.8);
    }

    .real-block {
      background-color: #ffea00;
      border-color: #ffea00;
    }
  </style>
</head>
<body>

  <main class="game-card">
    <div>
      <div class="timer-box">
        ⚠️ TIME REMAINING: <span id="timer">10</span>s
      </div>
    </div>

    <div class="phase-banner">
      Phase 1: The Rabbit Hole
    </div>

    <h1>Door 2</h1>

    <img src="img/The Rabbit Hole.png" alt="Stage One: Rabbit Hole Reset" class="stage-img">

    <div class="narrative-box">
      <p class="narrative">
        Click the correct yellow block to continue your journey through the Rabbit Hole. 
      </p>
    </div>

    <div class="blocks-grid">
      <button class="yellow-block-btn" onclick="wrongBlock()"></button>
      <button class="yellow-block-btn" onclick="wrongBlock()"></button>
      
      <button class="yellow-block-btn real-block" onmouseover="dodgeBlock(this)" onclick="window.location.href='Mad Tea Party 2.html';"></button>
      
      <button class="yellow-block-btn" onclick="wrongBlock()"></button>
      <button class="yellow-block-btn" onclick="wrongBlock()"></button>
    </div>
  </main>

  <script>
    let seconds = 10;
    const timerElement = document.getElementById('timer');
    
    const countdown = setInterval(() => {
      seconds--;
      if (timerElement) {
        timerElement.textContent = seconds;
      }
      if (seconds <= 0) {
        clearInterval(countdown);
        window.location.href = 'index.html'; 
      }
    }, 1000);

    function dodgeBlock(btn) {
      const randomX = Math.floor(Math.random() * 160) - 80;
      const randomY = Math.floor(Math.random() * 80) - 40;
      btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

  </script>

</body>
</html>
